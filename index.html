<script>const SRC={"Main": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Midrash Elyon — Home<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=David+Libre:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>body{margin:0}a{text-decoration:none}<\/style>\n<\/helmet>\n<div style=\"font-family:'Inter',sans-serif;color:#2a1a14;background:#f4ecdc\">\n\n  <dc-import name=\"Nav\" active=\"\" hint-size=\"100%,170px\"><\/dc-import>\n\n  <!-- HERO -->\n  <section style=\"position:relative;overflow:hidden;background:{{hero.bg}}\">\n    <svg aria-hidden=\"true\" width=\"620\" height=\"400\" viewBox=\"0 0 620 400\" fill=\"none\" stroke=\"{{hero.motif}}\" stroke-width=\"12\" stroke-linecap=\"square\" style=\"position:absolute;right:-60px;top:30px;opacity:0.22;max-width:90%\">\n      <path d=\"M20 380 L310 90 L600 380\"/><path d=\"M120 380 L310 190 L500 380\"/><path d=\"M220 380 L310 290 L400 380\"/>\n    <\/svg>\n    <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:84px 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\"><span style=\"width:34px;height:2px;background:{{hero.eyebrow}};display:block\"><\/span><span style=\"font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:{{hero.eyebrow}}\">Midrash Elyon<\/span><\/div>\n        <h1 style=\"margin:0;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(44px,7.4vw,96px);line-height:1.04;color:{{hero.headline}}\">Where Families\n          <span style=\"display:block;color:{{hero.grow}};letter-spacing:0.12em;font-weight:700\"><span style=\"display:inline-block;transform:translateY(0.13em)\">G<\/span><span style=\"display:inline-block;transform:translateY(0.065em)\">R<\/span><span style=\"display:inline-block\">O<\/span><span style=\"display:inline-block;transform:translateY(-0.065em)\">W<\/span><\/span>\n        <\/h1>\n        <p style=\"margin:26px 0 34px;max-width:520px;font-size:clamp(17px,2.2vw,20px);line-height:1.6;color:{{hero.lede}}\">Men, women and children, growing together in Torah, in prayer and in friendship.<\/p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n          <a href=\"Schedule.dc.html\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:3px;background:{{hero.btnBg}};color:{{hero.btnText}};font-size:16px;font-weight:700\">See this Shabbat<\/a>\n          <a href=\"About.dc.html\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:3px;border:2px solid {{hero.ghost}};color:{{hero.ghost}};font-size:16px;font-weight:700\">Meet our community<\/a>\n        <\/div>\n      <\/div>\n      <div style=\"background:{{hero.cardBg}};color:{{hero.cardText}};border-radius:6px;padding:30px 30px 26px;border:1px solid {{hero.cardBorder}}\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px\">\n          <span style=\"font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:{{hero.cardKicker}}\">Next up<\/span>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-size:13px;color:{{hero.cardMuted}}\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2f7a4a;display:block\"><\/span>Live<\/span>\n        <\/div>\n        <sc-for list=\"{{nextUp}}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;justify-content:space-betwee olor:#7a5a1f\">Our story<\/span><\/div>\n      <h2 style=\"margin:0 0 24px;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(30px,4.6vw,44px);line-height:1.15;color:#7a4b25\">A home where families grow<\/h2>\n      <p style=\"margin:0 0 18px;font-size:18px;line-height:1.75;color:#2a1a14\">Founded on a bedrock of warmth, growth and commitment by Rabbi David Haber, Midrash Elyon began with a handful of members seeking a higher plane in their spiritual journey. Within just a few months, a Shabbat minyan, designed for young men seeking an environment conducive to them, morphed into a full-scale Shul with multiple daily functions. Personal connection and individual, non-judgmental growth are the cornerstones of this budding Makom Torah and Teffilah.<\/p>\n      <p style=\"margin:0;font-size:18px;line-height:1.75;color:#2a1a14\">Today, 4 years since its founding, Midrash Elyon is proud to be the home for nearly 300 young families in our community! With a deep relationship with the Rabbi and a commitment to strengthening themselves and their families the Kahal at Midrash Elyon is poised for even more growth in the coming years ahead.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- RABBI -->\n  <dc-import name=\"RabbiBlurb\" surface=\"band\" show-more=\"no\" hint-size=\"100%,560px\"><\/dc-import>\n\n  <!-- VISIT -->\n  <section style=\"background:#7a4b25;color:#e8dcc3\">\n    <div style=\"max-width:1100px;margin:0 auto;padding:64px 24px 68px\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px\"><span style=\"width:34px;height:2px;background:#c5a059;display:block\"><\/span><span style=\"font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#efdcae\">Visit us<\/span><\/div>\n      <h2 style=\"margin:0 0 26px;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.15;color:#fbf6ec\">Come and see for yourself<\/h2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-f style>\n<\/helmet>\n<section style=\"font-family:'Inter',sans-serif;color:#2a1a14;background:{{bg}}\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:72px 24px 76px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:36px 52px;align-items:center\">\n    <div style=\"max-width:320px;width:100%;margin:0 auto\">\n      <div style=\"aspect-ratio:4/5;background:#7a4b25;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid #c5a059\">\n        <span style=\"width:100px;height:100px;border-radius:50%;border:2px solid #c5a059;display:inline-flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:38px;font-weight:600;color:#efdcae\">DH<\/span>\n        <span style=\"font-size:14px;color:#ecdfc3;letter-spacing:0.04em\">[Portrait of Rabbi Haber]<\/span>\n      <\/div>\n    <\/div>\n    <div>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px\"><span style=\"width:34px;height:2px;background:#7a5a1f;display:block\"><\/span><span style=\"font-size:13px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#7a5a1f\">Our Rabbi<\/span><\/div>\n      <h2 style=\"margin:0 0 16px;font-family:'Cinzel',serif;font-weight:600;font-size:clamp(30px,4.4vw,44px);line-height:1.1;color:#7a4b25\">Rabbi David Haber<\/h2>\n      <p style=\"margin:0 0 20px;font-size:18px;line-height:1.7;color:#2a1a14\">Every Shabbat, our community gathers around Rabbi David Haber for the Kiddush and class that follow prayers, and for his Shabbat speech. Through the week he teaches LIFE, a class of Alit, our women's learning program.<\/p>\n      <blockquote style=\"margin:0 0 22px;padding:16px 20px;background:#7a4b25;border-radius:4px;font-family:'Cinzel',serif;font-size:20px;line-height:1.5;color:#fbf6ec\">&ldquo;[A short welcome from Rabbi Haber]&rdquo;<\/blockquote>\n      <sc-if value=\"{{showMore}}\" hint-placeholder-val=\"{{ true }}\">< 6px 20px\"><span style=\"font-family:'Cinzel',serif;font-size:15px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#efdcae\">Coming up<\/span><span style=\"font-size:17px\">Rosh Hodesh Kislev &mdash; Tuesday, November 10 &amp; Wednesday, November 11<\/span><\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{isYear}}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fbf6ec;border:1px solid #d8c8a6;border-radius:4px;padding:6px 22px\">\n      <sc-for list=\"{{events}}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding:14px 0;border-bottom:1px solid #e3d5b7\">\n          <span style=\"flex:0 0 130px;font-size:16px;font-weight:700;color:#7a4b25\">{{e.when}}<\/span>\n          <span style=\"flex:1 1 240px;min-width:0\"><span style=\"font-size:17px;font-weight:600;color:#2a1a14\">{{e.name}}<\/span><span style=\"display:block;font-size:14px;color:#54402f;line-height:1.5\">{{e.note}}<\/span><\/span>\n          <span style=\"flex:none;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#54402f\">{{e.kind}}<\/span>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div style=\"margin-top:18px\"><button type=\"button\" onClick=\"{{toggleYear}}\" style=\"min-height:46px;padding:0 24px;border-radius:3px;border:2px solid #631000;background:transparent;color:#631000;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;cursor:pointer\">{{yearButton}}<\/button><\/div>\n    <\/sc-if>\n  <\/div>\n<\/section>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":820}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { tab: 'shabbat', all: false }; }\n  renderVals() {\n    const tab = this.state.tab, all = this.state.all;\n    const on = (t) => tab === t;\n    const T = '[time]', MUTED = '#7d6a55', INK = '#2a1a14';\n    const row = (label, time) => ({ label, time, color: time === T ? MUTED : INK });\n    const shabbatBlocks = [\n      { title: 'Friday Night', rows: [row('Candle lighting', '4:28 PM'), row('Shir HaShirim', T), row('Minha', T)] },\n      { title: 'Shabbat Morning', rows: [row('Shacharit', '8:30 AM'), row('Kiddush & class with Rabbi David Haber', 'After prayers'), row('Boys & Girls Programs', '9:15 – 11:30 AM'), row('Mishna Berura Shiur with Rabbi Ralph Tebele', 'After the speech')] },\n      { title: 'Shabbat Afternoon', rows: [row('Pre-Minha learning', T), row('Minha', T), row('Seudah Shelisheet & speech', 'After Minha'), row('Havdalah', '5:35 PM')] }\n    ];\n    const weekdayBlocks = [\n      { title: 'Mornings', rows: [row('Shacharit: Sunday', T), row('Shacharit: Monday to Friday', T)] },\n      { title: 'Evenings', rows: [row('Minha', T), row('Maariv', T)] }\n    ];\n    // when, name, note, kind\n    const E = [\n      ['Nov 10\\u201311', 'Rosh Hodesh Kislev', '', 'Rosh Hodesh'],\n      ['Dec 4', 'Hanukkah begins', 'First candle on Friday night, December 4', 'Holiday'],\n      ['Dec 10\\u201311', 'Rosh Hodesh Tevet', '', 'Rosh Hodesh'],\n      ['Dec 20', 'Tenth of Tevet', 'Fast day', 'Fast'],\n      ['Jan 9', 'Rosh Hodesh Shevat', '', 'Rosh Hodesh'],\n      ['Jan 23', 'Tu B\\u2019Shevat', '', 'Holiday'],\n      ['Feb 7\\u20138', 'Rosh Hodesh Adar I', '', 'Rosh Hodesh'],\n      ['Mar 9\\u201310', 'Rosh Hodesh Adar II', '', 'Rosh Hodesh'],\n      ['Mar 22', 'Fast of Esther', '', 'Fast'],\n      ['Mar 23', 'Purim', '', 'Holiday'],\n      ['Apr 8', 'Rosh Hodesh Nisan', '', 'Rosh Hodesh'],\n      ['Apr 22', 'Pesah begins', 'Begins Wednesday evening, April 21, and continues through Thursday, April 29', 'Holiday'],\n      ['May 7\\u20138', 'Rosh Hodesh Iyar', '', 'Rosh Hodesh'],\n      ['May 25', 'Lag BaOmer', '', 'Holiday'],\n      ['Jun 6', 'Rosh Hodesh Sivan', '', 'Rosh Hodesh'],\n      ['Jun 11', 'Shavuot', 'Begins Thursday evening, June 10', 'Holiday'],\n      ['Jul 5\\u20136', 'Ro const STATE={}; const cache={}; let PAGE='Main';
class DCLogic{ constructor(props){ this.props=props||{}; this.state={}; }
  setState(s){ Object.assign(this.state,s); STATE[this.__name]=this.state; draw(true); } }
const resolve=(path,scope)=>{ path=path.trim(); if(path==='true')return true; if(path==='false')return false; let v=scope; for(const p of path.split('.')){ if(v==null)return undefined; v=v[p]; } return v; };
const interp=(str,scope)=>str.replace(/\{\{\s*([^}]+?)\s*\}\}/g,(_,p)=>{ const v=resolve(p,scope); return v==null?'':String(v); });
const whole=(str,scope)=>{ const m=/^\{\{\s*([^}]+?)\s*\}\}$/.exec(str); return m?resolve(m[1],scope):interp(str,scope); };
const camel=s=>s.replace(/-([a-z])/g,(_,c)=>c.toUpperCase());
function load(name){ if(!cache[name]){ const doc=new DOMParser().parseFromString(SRC[name],'text/html'); const code=doc.querySelector('script[data-dc-script]').textContent; cache[name]={doc,Component:new Function('DCLogic',code+';return Component;')(DCLogic)}; } return cache[name]; }
function expand(node,scope){
  if(node.nodeType===3) return [document.createTextNode(interp(node.textContent,scope))];
  if(node.nodeType!==1) return [];
  const tag=node.localName, kids=()=>[...node.childNodes];
  if(tag==='helmet') return [];
  if(tag==='sc-if'){ if(!whole(node.getAttribute('value')||'',scope)) return []; let out=[]; for(const c of kids()) out=out.concat(expand(c,scope)); return out; }
  if(tag==='sc-for'){ const list=whole(node.getAttribute('list'),scope)||[]; const as=node.getAttribute('as'); let out=[]; list.forEach((it,i)=>{ for(const c of kids()) out=out.concat(expand(c,Object.assign({},scope,{[as]:it,$index:i}))); }); return out; }
  if(tag==='dc-import'){ const props={}; for(const a of node.attributes){ if(a.name.startsWith('hint-')||a.name==='name') continue; props[camel(a.name)]=whole(a.value,scope); } return [comp(node.getAttribute('name'),props)]; }
  const el=document.createElementNS(node.namespaceURI,node.localName);
  for(const a of node.attributes){
    if(a.name.startsWith('hint-')) continue;
    if(/^on[a-z]+$/.test(a.name)){ const fn=whole(a.value,scope); if(typeof fn==='function') el.addEventListener(a.name.slice(2),fn); continue; }
    let v=interp(a.value,scope);
    if(a.name==='href'){ const m=/^([A-Za-z]+)\.dc\.html$/.exec(v); if(m) v='#/'+m[1]; }
    el.setAttribute(a.name,v);
  }
  for(const c of kids()) for(const n of expand(c,scope)) el.appendChild(n);
  return [el];
}
function comp(name,props){
  const {doc,Component}=load(name); const inst=new Component(props); inst.__name=name;

  const vals=inst.renderVals(); const wrap=document.createElement('div');
  for(const n of [...doc.querySelector('x-dc').childNodes]) for(const o of expand(n,vals)) wrap.appendChild(o);
  return wrap;
}
const TITLES={Main:'Home',About:'About us',Men:'Men',Women:'Women',Children:'Children',Schedule:'Schedule',Learn:'Learn'};
function draw(keepScroll){
